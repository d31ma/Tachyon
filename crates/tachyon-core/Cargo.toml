[package]
name = "tachyon-core"
description = "Project discovery, web compilation, scaffolding, and development serving for Tachyon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Exposes crate-private parsers and decoders to fuzz targets only.
# Never enable this in a released artifact.
fuzzing = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
cap-fs-ext.workspace = true
cap-std.workspace = true
command-group = { version = "5.0.1", features = ["with-tokio"] }
html5gum = { version = "0.8.4", default-features = false }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tachyon-contracts.workspace = true
tachyon-diagnostics.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }

[dev-dependencies]
jsonschema = { version = "0.52.1", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package]
name = "tachyon-cli"
description = "The Tachyon command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde_json.workspace = true
tachyon-contracts.workspace = true
tachyon-core.workspace = true
tachyon-diagnostics.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
jsonschema = { version = "0.52.0", default-features = false }
tempfile.workspace = true

[lints]
workspace = true

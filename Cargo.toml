[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
  "crates/tachyon-cli",
  "crates/tachyon-contracts",
  "crates/tachyon-core",
  "crates/tachyon-diagnostics",
]
default-members = [
  "crates/tachyon-cli",
  "crates/tachyon-contracts",
  "crates/tachyon-core",
  "crates/tachyon-diagnostics",
]

[workspace.package]
version = "0.0.0-phase4"
edition = "2024"
rust-version = "1.97.1"
authors = ["Tachyon Contributors"]
license = "MIT"
repository = "https://github.com/d31ma/Tachyon"

[workspace.dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tachyon-contracts = { path = "crates/tachyon-contracts", version = "=0.0.0-phase4" }
tachyon-core = { path = "crates/tachyon-core", version = "=0.0.0-phase4" }
tachyon-diagnostics = { path = "crates/tachyon-diagnostics", version = "=0.0.0-phase4" }
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-util = "0.7.19"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

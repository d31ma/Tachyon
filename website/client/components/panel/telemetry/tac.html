<w-card variant="outlined" class="panel-card panel-wide">
  <w-card-item title="Telemetry without a collector" subtitle="Companion fetches are timed in the page, persisted as spans in local storage, and summarized without a collector.">
  </w-card-item>
  <w-card-text>
    <div class="w-row ga-2 tel-status">
      <w-chip size="small">{loadingState()}</w-chip>
      <w-chip size="small">{spanCount} spans stored</w-chip>
      <w-chip size="small">avg {averageMs}</w-chip>
      <w-chip size="small">slowest {slowestMs}</w-chip>
    </div>

    <div class="w-row ga-2 tel-actions">
      <w-btn size="sm" variant="outlined" on:click="runBenchmark()">Benchmark companion fetches</w-btn>
      <w-btn size="sm" variant="text" on:click="clearSpans()">Clear spans</w-btn>
    </div>

    <pre class="tel-output" aria-live="polite">{recentSummary()}</pre>
  </w-card-text>
</w-card>

<w-card variant="outlined" class="panel-card panel-wide">
  <w-card-item title="Realtime between tabs" subtitle="BroadcastChannel delivers messages to every open tab instantly, while local storage keeps a durable history that new tabs replay.">
  </w-card-item>
  <w-card-text>
    <div class="rt-grid">
      <section class="rt-column" aria-label="Send a message">
        <label>Nickname <input class="rt-nickname" type="text" value="Ada" on:input="updateNickname($event.target.value)" /></label>
        <label>Message <input class="rt-message" type="text" value="Hello from another tab" on:input="messageText = $event.target.value" /></label>
        <div class="w-row ga-2 rt-actions">
          <w-btn size="sm" variant="filled" color="secondary" on:click="send()">Send to all tabs</w-btn>
          <w-btn size="sm" variant="text" on:click="disconnect()">Disconnect</w-btn>
          <w-btn size="sm" variant="outlined" on:click="connect()">Connect</w-btn>
        </div>
        <p class="rt-meta">Channel <w-chip size="x-small" color="primary">{status}</w-chip> — your nickname persists in sessionStorage.</p>
      </section>

      <section class="rt-column" aria-label="Received messages">
        <h3>Messages (live + replayed)</h3>
        <pre class="rt-messages" aria-live="polite">{messageSummary()}</pre>
        <div class="w-row ga-2 rt-actions">
          <w-btn size="sm" variant="text" on:click="loadHistory()">Reload history</w-btn>
          <w-btn size="sm" variant="text" on:click="clearHistory()">Clear history</w-btn>
        </div>
      </section>
    </div>
    <p class="rt-feedback" aria-live="polite">{feedback}</p>
  </w-card-text>
</w-card>

<w-card variant="outlined" class="panel-card" id="input-gallery">
  <w-card-item title="Every input, one Tac companion" subtitle="Native HTML controls pass through Tac templates while events and value bindings update component state.">
  </w-card-item>
  <w-card-text>
    <div class="signal-bar" role="status" aria-live="polite">
      <span class="signal-label">Latest signal</span>
      <strong>{lastControl}</strong>
      <code class="signal-value">{lastValue}</code>
      <span class="signal-count">{$interactionCount} interactions this session</span>
    </div>

    <form class="gallery" on:submit="preventAction('submit', $event)">
      <fieldset class="field-group">
        <legend>Writing and discovery</legend>
        <label>Text <input type="text" placeholder="Name" value="Tachyon" on:input="updateText($event.target.value)" /></label>
        <label>Search <input type="search" placeholder="Search packages" on:input="updateField('search', $event.target.value)" /></label>
        <label>Email <input type="email" placeholder="team@example.dev" on:input="updateField('email', $event.target.value)" /></label>
        <label>Password <input type="password" placeholder="Secret" on:input="recordSecret($event.target.value)" /></label>
        <label>Telephone <input type="tel" placeholder="+1 416 555 0100" on:input="updateField('telephone', $event.target.value)" /></label>
        <label>URL <input type="url" placeholder="https://tachyon.dev" on:input="updateField('link', $event.target.value)" /></label>
      </fieldset>

      <fieldset class="field-group">
        <legend>Numbers and colour</legend>
        <label>Number <input type="number" min="0" max="100" value="12" on:input="updateField('number', $event.target.value)" /></label>
        <label>Range <strong>{$range}</strong> <input type="range" min="0" max="100" value="72" on:input="updateRange($event.target.value)" /></label>
        <label>Color <input type="color" value="#0ea5e9" on:input="updateColour($event.target.value)" /></label>
      </fieldset>

      <fieldset class="field-group">
        <legend>Dates and schedules</legend>
        <label>Date <input type="date" on:change="updateField('date', $event.target.value)" /></label>
        <label>Date and time <input type="datetime-local" on:change="updateField('dateTime', $event.target.value)" /></label>
        <label>Month <input type="month" on:change="updateField('month', $event.target.value)" /></label>
        <label>Week <input type="week" on:change="updateField('week', $event.target.value)" /></label>
        <label>Time <input type="time" on:change="updateField('time', $event.target.value)" /></label>
      </fieldset>

      <fieldset class="field-group">
        <legend>Selections and files</legend>
        <label class="inline"><input type="checkbox" on:change="updateSubscription($event.target.checked)" /> Checkbox</label>
        <div class="inline-row" role="group" aria-label="Plan">
          <label class="inline"><input type="radio" name="tac-plan" value="starter" checked on:change="updatePlan($event.target.value)" /> Starter</label>
          <label class="inline"><input type="radio" name="tac-plan" value="production" on:change="updatePlan($event.target.value)" /> Production</label>
        </div>
        <input type="file" class="file-input" aria-label="Input file" on:change="recordFiles($event.target.files)" />
        <div class="dropzone"
          on:click="triggerFilePicker()" on:dragover="onDragOver($event)" on:dragleave="onDragLeave()" on:drop="onDrop($event)"
          role="button" tabindex="0">
          <span class="file-chip">{fileStatus()}</span>
          <w-btn size="sm" variant="text" on:click="clearFile($event)">Clear</w-btn>
        </div>
      </fieldset>

      <fieldset class="field-group">
        <legend>Beyond input</legend>
        <label>Select
          <select on:change="updateField('stack', $event.target.value)">
            <option value="frontend">Tac frontend</option>
            <option value="backend">Yon backend</option>
            <option value="fullstack">Full stack</option>
          </select>
        </label>
        <label>Datalist
          <input type="text" list="tac-platform-options" placeholder="Choose a platform" on:input="updateField('runtime', $event.target.value)" />
          <datalist id="tac-platform-options">
            <option value="Tachyon"></option>
            <option value="Browser APIs"></option>
          </datalist>
        </label>
        <label>Textarea <textarea rows="3" on:input="updateField('notes', $event.target.value)">Reactive components feel natural in Tac.</textarea></label>
      </fieldset>

      <fieldset class="field-group">
        <legend>Actions and hidden values</legend>
        <input type="hidden" name="framework" value="tac" />
        <div class="inline-row">
          <input type="button" value="Button" on:click="record('button', 'clicked')" />
          <input type="submit" value="Submit" />
          <input type="reset" value="Reset" on:click="resetValues()" />
        </div>
        <p class="hint">A hidden <code>framework=tac</code> value is also present in this form.</p>
      </fieldset>
    </form>
  </w-card-text>
</w-card>

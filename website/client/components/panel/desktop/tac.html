<w-card variant="outlined" class="panel-card">
  <w-card-item title="Platform-aware globals" subtitle="Templates read platform (desktop/mobile/web), environment/os (windows/macos/linux/android/ios/web) and target without imports; companions receive the same context through this.tac.platform.">
  </w-card-item>
  <w-card-text>
    <div class="w-row ga-2 platform-chips">
      <w-chip size="small" color="primary">platform: web</w-chip>
      <w-chip size="small">os: web</w-chip>
      <w-chip size="small">environment: web</w-chip>
      <w-chip size="small">target: web</w-chip>
    </div>

    <p class="platform-note">This is the web platform bundle. The same client source also builds macOS, Windows, Linux, iOS and Android hosts with <code>ty bundle --target all</code>.</p>

    <p class="platform-worker">
      The current Tac companion sees: <strong>web platform controller on the web environment</strong>
    </p>
  </w-card-text>
</w-card>

<section class="section" aria-labelledby="quickstart-heading">
  <div class="section-head--center">
    <span class="eyebrow">From nothing to serving</span>
    <h2 id="quickstart-heading" class="section-title">Start in three commands.</h2>
    <p class="section-lede mx-auto">
      The web bundle is written to <code>dist/web/</code>. Add <code>--target macos</code>,
      <code>windows</code>, <code>linux</code>, <code>android</code> or <code>ios</code> for a
      native application built from the same source.
    </p>
  </div>

  <!-- Three steps rather than one block: each command answers a different
       question, and a reader scanning for the middle one should not have to
       parse a shell script to find it. -->
  <div class="grid-auto mt-10" style="--col: 15rem; --grid-gap: var(--gutter)">
    <loop :for="step of steps()">
      <div class="quickstart-step panel p-gutter">
        <p class="stat-value text-2xl">{step.number}</p>
        <p class="mt-3 font-semibold">{step.title}</p>
        <pre class="code-block mt-3 text-xs"><code>{step.command}</code><button
          type="button" class="code-copy" on:click="copy(step.number)"
          :aria-label="'Copy step ' + step.number">{label(step.number)}</button></pre>
        <p class="mt-3 text-sm opacity-70 text-pretty">{step.note}</p>
      </div>
    </loop>
  </div>
</section>

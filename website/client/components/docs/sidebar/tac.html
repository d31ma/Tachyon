<!-- One navigation for the whole documentation, sectioned.
     <details> rather than a scripted accordion: the disclosure, its keyboard
     behaviour and its announced state are the element's own, and a component
     reimplementing them would only be a worse version that also needs
     JavaScript to open.

     Below the width where the shell has a column to put this in, it becomes a
     drawer. Stacked in flow it pushed the article a whole screen down, which
     on a phone means every documentation page opens on its own navigation. -->
<button type="button" class="docs-nav-toggle" on:click="toggle()"
        :aria-expanded="open ? 'true' : 'false'" aria-controls="docs-nav-panel">
  <span aria-hidden="true">☰</span> Documentation menu
</button>

<div class="docs-nav-scrim" hidden="{open ? '' : 'hidden'}" on:click="close()"></div>

<nav id="docs-nav-panel" aria-label="Documentation" class="docs-nav"
     :data-open="open ? 'true' : 'false'" on:keydown="dismiss($event.key)">
  <loop :for="section of sections()">
    <details class="docs-nav__section" :open="section.open">
      <summary class="docs-nav__summary">
        <span>{section.name}</span>
        <span class="docs-nav__chevron" aria-hidden="true">›</span>
      </summary>
      <ul class="docs-nav__list list-none p-0 m-0">
        <loop :for="link of section.links">
          <li>
            <a class="docs-nav__link" :href="link.path"
               :aria-current="link.current ? 'page' : 'false'">{link.title}</a>
          </li>
        </loop>
      </ul>
    </details>
  </loop>
</nav>

name: Feature proposal
description: Propose a Tachyon capability or public behavior.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the developer or operator outcome, not an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed observable behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and platform implications
    validations:
      required: true

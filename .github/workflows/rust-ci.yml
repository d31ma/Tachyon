name: Rust Rewrite

on:
  workflow_call:
  pull_request:
    branches: [main, codex/rust-rewrite]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [codex/rust-rewrite]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  rewrite-policy:
    name: Rewrite-only repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Reject an in-tree legacy runtime or legacy entry point
        run: cargo test --locked -p tachyon-contracts --test repository_policy

  native:
    name: Native Rust gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && rustup default 1.97.1

      - name: Install Phase 2 JavaScript runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Install Phase 2 Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.6

      - name: Install the pinned TypeScript compiler for tac.ts emission
        run: npm install --no-save typescript@7.0.2 && npx tsc --version

      - name: Show toolchain
        run: rustc --version --verbose && cargo --version --verbose && node --version && python --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run unit and Phase 4 real-process acceptance tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Smoke-test the release binary
        run: cargo run --release --locked --bin ty -- --version

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: Dependency, license, and source policy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.7 --locked

      - name: Check advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

  browser:
    name: Phase 3 Chromium island behavior
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install locked browser dependencies
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium

      - name: Type-check the migrated website and browser harnesses
        run: bun run typecheck

      - name: Build the Phase 3 CLI
        run: cargo build --locked --bin ty

      - name: Run the real-browser island contract
        run: bun run test:rust-browser

      - name: Build the release CLI for the event gate
        run: cargo build --release --locked --bin ty

      - name: Run the real-browser event hydration contract
        run: bun run test:rust-events

      - name: Run the real-browser offline cache contract
        run: bun run test:rust-offline

      - name: Run the real-browser island expression contract
        run: bun run test:rust-islands

      - name: Probe the wasm companion ABI
        run: |
          rustup target add wasm32-unknown-unknown
          bun run test:wasm-abi
          bun run test:wasm-companion

      - name: Verify every claim in the parity ledger
        run: bash scripts/compat/verify-ledger.sh

  macos-native:
    name: Phase 4 macOS native and mobile-web parity
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install exact Dart toolchain
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.6.0

      - name: Install exact .NET toolchain
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Install the .NET WebAssembly workload
        run: dotnet workload install wasm-tools-net9 --skip-manifest-update

      - name: Install exact Kotlin WebAssembly toolchain
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP}/kotlin-compiler.zip"
          curl --fail --location --silent --show-error \
            --output "${compiler}" \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip
          printf '%s  %s\n' \
            c6e9e2636889828e19c8811d5ab890862538c89dc2a3101956dfee3c2a8ba6b1 \
            "${compiler}" | shasum -a 256 --check
          unzip -q "${compiler}" -d "${RUNNER_TEMP}/kotlin"
          echo "${RUNNER_TEMP}/kotlin/kotlinc/bin" >> "${GITHUB_PATH}"
          stdlib="${RUNNER_TEMP}/kotlin-stdlib-wasm-js-2.1.10.klib"
          curl --fail --location --silent --show-error \
            --output "${stdlib}" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-wasm-js/2.1.10/kotlin-stdlib-wasm-js-2.1.10.klib
          printf '%s  %s\n' \
            db9ab6772a2d3af9121d570a058cc64cf36893e1c089726b799b4d1252184ca2 \
            "${stdlib}" | shasum -a 256 --check
          echo "KOTLIN_WASM_STDLIB=${stdlib}" >> "${GITHUB_ENV}"

      - name: Install exact Swift WebAssembly toolchain
        run: |
          set -euo pipefail
          swift_pkg="${RUNNER_TEMP}/swift-6.3.3-RELEASE-osx.pkg"
          curl --fail --location --silent --show-error \
            --output "${swift_pkg}" \
            https://download.swift.org/swift-6.3.3-release/xcode/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-osx.pkg
          pkgutil --check-signature "${swift_pkg}" \
            | grep -F 'Developer ID Installer: Swift Open Source (V9AUD2URP3)'
          installer -pkg "${swift_pkg}" -target CurrentUserHomeDirectory
          xcrun --toolchain swift swiftc --version | grep -F 'Swift version 6.3.3'
          xcrun --toolchain swift swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7

      - name: Install locked browser dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd website --frozen-lockfile
          bunx playwright install chromium

      - name: Build the Phase 4 CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --bin ty

      - name: Verify every website compiler is ready
        run: ./target/debug/ty doctor website

      - name: Run the migrated website acceptance suite
        run: bun run test:website

      - name: Run native launch, accessibility, lifecycle, and visual parity gate
        run: bun run test:rust-macos

  linux-native:
    name: Phase 5 Linux GTK4 native gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build the pinned Linux execution image
        run: docker build -f scripts/linux/Dockerfile -t tachyon-linux-gate:${{ env.RUST_TOOLCHAIN }} scripts/linux

      - name: Compile, launch, and read accessible names over AT-SPI
        run: >-
          docker run --rm
          --cap-add SYS_ADMIN --cap-add NET_ADMIN
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          -v "$PWD":/workspace -w /workspace
          -e CARGO_TARGET_DIR=/tmp/ty-target
          tachyon-linux-gate:${{ env.RUST_TOOLCHAIN }}
          ./scripts/linux/native-test.sh

  windows-native:
    name: Phase 5 Windows Win32 native gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Show the platform C toolchain
        run: gcc --version

      - name: Build, launch, and drive the generated application
        # The UIAutomationClient managed proxies are a .NET Framework surface.
        # Windows PowerShell loads them reliably; PowerShell 7 falls through to
        # generic Pane elements even when the provider assembly is present.
        shell: powershell
        run: ./scripts/windows/native-test.ps1

  android-native:
    name: Phase 5 Android native gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Both avdmanager and emulator must resolve the same explicit user and
      # AVD directories instead of deriving independently from runner HOME.
      ANDROID_USER_HOME: /tmp/tachyon-android
      ANDROID_AVD_HOME: /tmp/tachyon-android/avd

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Select the runner's preinstalled JDK and Gradle
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_21_X64}/bin" >> "${GITHUB_PATH}"
          gradle --version
          java -version

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "${sdkmanager}" --licenses > /dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          test "${sdk_status}" -eq 0
          "${sdkmanager}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot a headless emulator
        run: |
          set -euo pipefail
          avdmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${avdmanager}" create avd -n tachyon-gate \
            -k "system-images;android-35;google_apis;x86_64" \
            -p "${ANDROID_AVD_HOME}/tachyon-gate.avd" \
            --device pixel_6 --force
          test -f "${ANDROID_AVD_HOME}/tachyon-gate.ini"
          test -d "${ANDROID_AVD_HOME}/tachyon-gate.avd"
          "${avdmanager}" list avd
          emulator_log=/tmp/emulator.log
          # Headless emulators select SwiftShader automatically; the former
          # swiftshader_indirect mode is deprecated in current SDK releases.
          nohup "${ANDROID_HOME}/emulator/emulator" -avd tachyon-gate \
            -no-window -no-audio -no-snapshot -no-boot-anim \
            > "${emulator_log}" 2>&1 &
          emulator_pid=$!
          show_emulator_failure() {
            status=$?
            if [ "${status}" -ne 0 ]; then
              echo '--- emulator process ---'
              ps -p "${emulator_pid}" -f || true
              echo '--- adb devices ---'
              "${ANDROID_HOME}/platform-tools/adb" devices -l || true
              echo '--- emulator log ---'
              tail -200 "${emulator_log}" || true
            fi
            exit "${status}"
          }
          trap show_emulator_failure EXIT
          adb="${ANDROID_HOME}/platform-tools/adb"
          timeout 180 "${adb}" wait-for-device
          boot_deadline=$((SECONDS + 600))
          until [ "$("${adb}" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
            if [ "${SECONDS}" -ge "${boot_deadline}" ]; then
              echo 'Android did not report sys.boot_completed=1 within 600 seconds' >&2
              exit 124
            fi
            sleep 5
          done
          trap - EXIT

      - name: Assemble, launch, and drive the generated application
        run: ./scripts/android/native-test.sh

  compatibility:
    name: Phase 6 released-binary compatibility differential
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install locked browser dependencies
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium

      - name: Build the Phase 6 CLI
        run: cargo build --locked --bin ty

      - name: Fetch the immutable v26.30.04 compatibility oracle
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tachyon-compat"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/tachyon-compat/ty-linux-x64" \
            https://github.com/d31ma/Tachyon/releases/download/v26.30.04/ty-linux-x64
          printf '%s  %s\n' \
            '0ccf5db78f196db3d9279b2a533a22e2413a146c91968775aa7c988d0c89f72d' \
            "${RUNNER_TEMP}/tachyon-compat/ty-linux-x64" \
            | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/tachyon-compat/ty-linux-x64"
          echo "RELEASED_TY_BIN=${RUNNER_TEMP}/tachyon-compat/ty-linux-x64" >> "${GITHUB_ENV}"

      - name: Compare both implementations over the shared corpus
        run: bun run test:compat

      - name: Run the released standalone workflow against Rust
        run: bun run test:rust-standalone

      - name: Classify the archived migration fixture
        run: >-
          ./target/debug/ty migrate check
          crates/tachyon-cli/tests/fixtures/migration-fullstack
          --allow-unsupported

  fuzz:
    name: Phase 7 fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rust-src

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz every trust boundary under AddressSanitizer
        run: |
          set -euo pipefail
          for target in html_frontend template_frontend handler_frame native_planner; do
            echo "==> ${target}"
            cargo +nightly-2026-07-20 fuzz run "${target}" -- \
              -max_total_time=${FUZZ_SECONDS} -rss_limit_mb=2048 -timeout=10
          done
        env:
          FUZZ_SECONDS: "300"

      - name: Publish any crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  sanitizers:
    name: Phase 7 sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rust-src

      - name: Install Phase 2 runtimes
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Run the library suite under AddressSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=address"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

      - name: Run the library suite under LeakSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=leak"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

      - name: Run the library suite under ThreadSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=thread"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

  soak:
    name: Phase 7 soak and recovery drills
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Run interruption, corruption, contention, and load drills
        run: cargo test --locked -p tachyon-cli --test phase7_cli -- --test-threads=1
        env:
          TACHYON_SOAK_ITERATIONS: "200"

  provenance:
    name: Phase 7 supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install pinned SBOM and audit tooling
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo install cargo-auditable --version 0.7.0 --locked

      - name: Generate a CycloneDX software bill of materials
        run: cargo cyclonedx --all --format json

      - name: Build a release binary with an embedded dependency list
        run: cargo auditable build --release --locked --bin ty

      - name: Publish the bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  release-lifecycle:
    name: Cutover release lifecycle drill
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Provenance is attested from the workflow's own identity, so the build
    # that produced an artifact is verifiable without a maintainer key.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Verify, install, upgrade, roll back, and uninstall a real artifact
        run: ./scripts/release/lifecycle-drill.sh

      - name: Build the artifact retained for attestation
        run: ./scripts/release/build-artifact.sh

      - name: Attest what built this artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/release-artifact/*.tar.gz

      - name: Publish the verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tachyon-${{ matrix.os }}
          path: target/release-artifact/*.tar.gz

  coverage:
    name: Rust coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview && rustup default 1.97.1

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked

      - name: Enforce the whole-workspace coverage floor
        run: >-
          cargo llvm-cov
          --workspace
          --all-features
          --locked
          --ignore-filename-regex 'crates/tachyon-core/src/native/(compiler|macos)\.rs'
          --fail-under-lines 80
          --fail-under-functions 80
          --fail-under-regions 80

name: Rust Rewrite

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, develop, codex/rust-rewrite]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [develop, codex/rust-rewrite, "work/**"]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  rewrite-policy:
    name: Rewrite-only repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run the repository policy tests
        run: cargo test --locked -p tachyon-contracts --test repository_policy

      - name: Check native gate shell entry points
        run: |
          bash -n scripts/android/native-test.sh
          bash -n scripts/linux/native-test.sh

  native:
    name: Native Rust gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && rustup default 1.97.1

      - name: Install OpenSSL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6

      - name: Install Ruby for Ruby Yon handlers and client test units
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.6"

      - name: Install the pinned Emscripten for the Tac Ruby runtime
        run: node scripts/ci/install-emscripten.mjs "${{ runner.temp }}/tachyon-emscripten"

      - name: Restore the Tac Ruby runtime built from runtimes/ruby-web
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/tachyon/ruby-web
            ~/Library/Caches/Tachyon/ruby-web
            ~/AppData/Local/Tachyon/Cache/ruby-web
          key: tachyon-ruby-web-${{ runner.os }}-${{ hashFiles('runtimes/ruby-web/**') }}

      - name: Install the pinned TypeScript compiler for tac.ts emission
        run: npm install --no-save typescript@7.0.2 && npx tsc --version

      - name: Install Go for Go Yon handlers and Go web services
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install the WebAssembly target for Rust web services on native targets
        run: rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Install .NET for C# web services on native targets
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install the C# WebAssembly workload
        run: dotnet workload install wasm-tools wasm-tools-net9

      - name: Show tool versions
        run: rustc --version --verbose && cargo --version --verbose && node --version && python --version && ruby --version && go version

      - name: Install checksum-pinned CHEX for real schema contracts
        run: node scripts/ci/install-chex.mjs "${{ runner.temp }}/tachyon-chex"

      - name: Check formatting
        run: cargo fmt --check

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run unit and Phase 4 real-process acceptance tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Execute target-native companion behavior through the built CLI
        run: node scripts/native/companion-test.mjs
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Smoke-test the release binary
        run: cargo run --release --locked --bin ty -- --version

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  managed-storage:
    name: Real managed SQL, document and Redis contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install OpenSSL build and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev openssl

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install checksum-pinned FYLO
        run: node scripts/ci/install-fylo.mjs "${{ runner.temp }}/tachyon-fylo"

      - name: Verify SQLite, FYLO, PostgreSQL, MySQL, MariaDB and Redis
        run: node scripts/test-managed-storage.mjs

  supply-chain:
    name: Dependency, license, and source policy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.7 --locked

      - name: Check advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

  browser:
    name: Phase 3 Chromium component and service behavior
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install the WebAssembly target for Rust web services
        run: rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Install Go for Go web services
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install .NET for C# WebAssembly event contracts
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install the C# WebAssembly workload
        run: dotnet workload install wasm-tools wasm-tools-net9

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install locked browser dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd website --frozen-lockfile
          bunx playwright install --with-deps chromium firefox webkit

      - name: Install Ruby for the Tac Ruby runtime build
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.6"

      - name: Install the pinned Emscripten for the Tac Ruby runtime
        run: node scripts/ci/install-emscripten.mjs "${{ runner.temp }}/tachyon-emscripten"

      - name: Restore the Tac Ruby runtime built from runtimes/ruby-web
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/tachyon/ruby-web
            ~/Library/Caches/Tachyon/ruby-web
            ~/AppData/Local/Tachyon/Cache/ruby-web
          key: tachyon-ruby-web-${{ runner.os }}-${{ hashFiles('runtimes/ruby-web/**') }}

      - name: Check the website data generated from website/content
        run: node website/scripts/build-content.mjs --check

      - name: Check the generated website styles
        run: node website/scripts/build-styles.mjs --check

      - name: Check that every website snippet language gap has an example or a stated reason
        run: node website/scripts/language-coverage.mjs --strict

      - name: Build the Phase 3 CLI
        run: cargo build --locked --bin ty

      - name: Type-check the migrated website and browser harnesses
        run: |
          ./target/debug/ty types website
          bun run typecheck

      - name: Run the real-browser Tac component contract
        run: bun run test:phase3-browser

      - name: Verify Tac clients, injected providers and owner cancellation
        run: node scripts/tac-client-test.mjs
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty

      - name: Verify injected-publisher application events and lifecycle resources
        run: |
          bun run test:application-events
          bun run test:tac-events
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty

      - name: Run the semantic hot-update contract
        run: bun run test:hot-update-browser

      - name: Build the release CLI for the event gate
        run: cargo build --release --locked --bin ty

      - name: Run the real-browser Tac event contract
        run: bun run test:events-browser

      - name: Run the real-browser offline cache contract
        run: bun run test:service-worker-browser

      - name: Run the real-browser Tac expression contract
        run: bun run test:island-expression

      - name: Run restored browser persistence and runtime contracts
        run: |
          bun run test:storage-browser
          bun run test:runtime-browser
          bun run test:safe-html-browser

      - name: Run the real-browser web components contract
        run: bun run test:web-components-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty

      - name: Keep authored nodes across Tac updates in every browser
        run: bun run test:authored-node-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty

      - name: Keep SVG namespaces across Tac updates in every browser
        run: bun run test:svg-namespace-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty

      - name: Run Tac logic and loop controls in every browser
        run: bun run test:logic-controls-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty

      - name: Serve the default JavaScript and TypeScript scaffolds in every browser
        run: bun run test:scaffold-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty
          YON_JAVASCRIPT_RUNTIME: bun

      - name: Verify shared Tac and Yon behavior adapters
        run: |
          bun run test:behavior-runtime
          bun run test:behavior-browser

      - name: Install checksum-pinned CHEX
        run: node scripts/ci/install-chex.mjs "${{ runner.temp }}/tachyon-chex"

      - name: Exercise schema validation through the compiled CLI
        run: node scripts/schema-contract-smoke.mjs
        env:
          TAC_BIN: ${{ github.workspace }}/target/release/ty

      - name: Check the website layout at every responsive width
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/tachyon-responsive-site"
          ./target/release/ty build website --out-dir "${site}"
          ./target/release/ty preview website --static --out-dir "${site}" --port 4700 \
            > "${RUNNER_TEMP}/responsive-preview.log" 2>&1 &
          preview=$!
          trap 'kill "${preview}"' EXIT
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4700/; then
              break
            fi
            sleep 1
          done
          node website/scripts/check-responsive.mjs

      - name: Verify every claim in the parity ledger
        run: bash scripts/compat/verify-ledger.sh

  macos-native:
    name: Phase 4 macOS native and mobile-web parity
    runs-on: macos-latest
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install exact .NET toolchain for target-native companions
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install the WebAssembly target for Rust web services
        run: rustup target add wasm32-unknown-unknown --toolchain 1.97.1

      - name: Install the C# WebAssembly workload
        run: dotnet workload install wasm-tools wasm-tools-net9

      - name: Install PHP and php-cgi for published Yon examples
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Install Ruby for published Yon examples and Ruby test units
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.6"

      - name: Install the pinned Emscripten for the Tac Ruby runtime
        run: node scripts/ci/install-emscripten.mjs "${{ runner.temp }}/tachyon-emscripten"

      - name: Restore the Tac Ruby runtime built from runtimes/ruby-web
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/tachyon/ruby-web
            ~/Library/Caches/Tachyon/ruby-web
            ~/AppData/Local/Tachyon/Cache/ruby-web
          key: tachyon-ruby-web-${{ runner.os }}-${{ hashFiles('runtimes/ruby-web/**') }}

      - name: Install Go for Go Yon handlers and Go web services
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install locked browser dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd website --frozen-lockfile
          bunx playwright install chromium

      - name: Install checksum-pinned Kotlin compiler for published Yon examples
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP}/kotlin-compiler.zip"
          expected_checksum=c6e9e2636889828e19c8811d5ab890862538c89dc2a3101956dfee3c2a8ba6b1
          curl --fail --location --silent --show-error --max-time 120 \
            --output "${compiler}" \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip
          echo "${expected_checksum}  ${compiler}" | shasum -a 256 --check
          unzip -q "${compiler}" -d "${RUNNER_TEMP}/kotlin"
          echo "${RUNNER_TEMP}/kotlin/kotlinc/bin" >> "${GITHUB_PATH}"

      - name: Install the checksum-pinned Kotlin/Wasm standard library for Kotlin web services
        run: |
          set -euo pipefail
          library="${RUNNER_TEMP}/kotlin-stdlib-wasm-js-2.1.10.klib"
          expected_checksum=db9ab6772a2d3af9121d570a058cc64cf36893e1c089726b799b4d1252184ca2
          curl --fail --location --silent --show-error --max-time 120 \
            --output "${library}" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-wasm-js/2.1.10/kotlin-stdlib-wasm-js-2.1.10.klib
          echo "${expected_checksum}  ${library}" | shasum -a 256 --check
          echo "TAC_KOTLIN_WASM_STDLIB=${library}" >> "${GITHUB_ENV}"

      - name: Install checksum-pinned Dart SDK for Dart services and published examples
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP}/dartsdk.zip"
          expected_checksum=367984941d8d14c653789f6f787312e715e5c546f6e9f5d30d86615c692907a9
          curl --fail --location --silent --show-error --max-time 180 \
            --output "${sdk}" \
            https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.1/sdk/dartsdk-macos-arm64-release.zip
          echo "${expected_checksum}  ${sdk}" | shasum -a 256 --check
          unzip -q "${sdk}" -d "${RUNNER_TEMP}/dart"
          echo "${RUNNER_TEMP}/dart/dart-sdk/bin" >> "${GITHUB_PATH}"

      - name: Install the pinned Swift 6.3.3 toolchain and Swift SDK for WebAssembly
        run: |
          set -euo pipefail
          release=https://download.swift.org/swift-6.3.3-release
          package="${RUNNER_TEMP}/swift-6.3.3-RELEASE-osx.pkg"
          curl --fail --location --silent --show-error --max-time 900 \
            --output "${package}" \
            "${release}/xcode/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-osx.pkg"
          pkgutil --check-signature "${package}" | grep -q "Swift Open Source (V9AUD2URP3)"
          installer -pkg "${package}" -target CurrentUserHomeDirectory
          toolchain="${HOME}/Library/Developer/Toolchains/swift-6.3.3-RELEASE.xctoolchain"
          sdks="${RUNNER_TEMP}/swift-sdks"
          "${toolchain}/usr/bin/swift" sdk install --swift-sdks-path "${sdks}" \
            "${release}/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          sdk="${sdks}/swift-6.3.3-RELEASE_wasm.artifactbundle/swift-6.3.3-RELEASE_wasm/wasm32-unknown-wasip1"
          test -d "${sdk}/WASI.sdk"
          echo "TAC_SWIFT_WASM_COMPILER=${toolchain}/usr/bin/swiftc" >> "${GITHUB_ENV}"
          echo "TAC_SWIFT_WASM_SDK=${sdk}" >> "${GITHUB_ENV}"

      - name: Install the checksum-pinned TeaVM 0.15 jars for Java web services
        run: |
          set -euo pipefail
          teavm="${RUNNER_TEMP}/teavm"
          mkdir -p "${teavm}"
          maven=https://repo1.maven.org/maven2/org/teavm
          while read -r artifact jar checksum; do
            curl --fail --location --silent --show-error --max-time 180 \
              --output "${teavm}/${jar}" "${maven}/${artifact}/0.15.0/${jar}"
            echo "${checksum}  ${teavm}/${jar}" | shasum -a 256 --check
          done <<'JARS'
          cli cli-0.15.0-all.jar c6a1ecb81dd90b66985ac7b0f09db55bec2076fa024428c7fe72b800b6b48cae
          teavm-classlib teavm-classlib-0.15.0.jar 7d805be4670a892a34c89d9d750a8afd65e2f8201b7b3a10343634ea19d1c410
          teavm-jso-impl teavm-jso-impl-0.15.0.jar 9a8d15205807b70d7efdfbd4c1356304954e20146e464aec3830dbc6616ef57c
          teavm-metaprogramming-impl teavm-metaprogramming-impl-0.15.0.jar 616d30aa28f7b0180a61c2289b11c77bf84c715bd79f255e1e42400edb5b6d70
          teavm-platform teavm-platform-0.15.0.jar 999d369ab15aa83c17987d048ba59560759169891de7e13a5a1c2bd93dd060a8
          JARS
          echo "TAC_TEAVM_HOME=${teavm}" >> "${GITHUB_ENV}"

      - name: Build the Phase 4 CLI
        run: cargo build --locked --bin ty

      - name: Verify every website compiler is ready
        run: ./target/debug/ty doctor website

      - name: Require every behavior annotation runtime
        run: |
          set -euo pipefail
          for runtime in node bun python3 php php-cgi ruby java javac kotlinc dotnet rustc swiftc dart dartaotruntime go; do
            command -v "${runtime}"
          done
          javac -version
          kotlinc -version
          swiftc --version

      - name: Execute JVM and native behavior adapter boundary contracts
        run: |
          bun run test:behavior-jvm
          bun run test:behavior-native-runtime
          python3 crates/tachyon-core/tests/fixtures/behavior/python_runtime_contract.py
          php crates/tachyon-core/tests/fixtures/behavior/php_runtime_contract.php
          ruby crates/tachyon-core/tests/fixtures/behavior/ruby_runtime_contract.rb

      - name: Execute emitted behavior annotations in every supported language
        run: |
          cargo test --locked -p tachyon-core --lib behavior::polyglot -- --test-threads=1
          cargo test --locked -p tachyon-core --test it -- \
            behavior_annotations:: behavior_dynamic:: \
            behavior_jvm:: behavior_csharp:: behavior_rust:: behavior_go:: \
            test_units::every_typed_language_clears_its_fakes_before_each_case --test-threads=1
        env:
          TAC_TEST_UNITS_REQUIRE_TOOLCHAINS: "1"

      - name: Execute Swift web services, Swift test units and Apple async companions
        run: |
          cargo test --locked -p tachyon-core --lib -- \
            tac_web::swift_tests:: a_swift_web_service_ web_fake_tests::a_swift \
            a_swift_native_companion --test-threads=1

      - name: Execute Java web services on TeaVM with a JDK 21
        run: |
          export PATH="${JAVA_HOME_21_arm64}/bin:${PATH}"
          javac -version
          cargo test --locked -p tachyon-core --lib -- \
            tac_web::java_tests:: tac_web::java_behavior_tests:: a_java_web_service_ \
            --test-threads=1

      - name: Execute Kotlin web services on Kotlin/Wasm
        run: |
          cargo test --locked -p tachyon-core --lib -- \
            tac_web::kotlin_tests:: model_sources::tests::a_kotlin_web_assembly_service_uses_a_model \
            --test-threads=1
        env:
          TAC_KOTLIN_WEB_REQUIRE_TOOLCHAINS: "1"

      - name: Run the C#, F#, Kotlin and Java browser fixture gates that tests mark as ignored
        run: |
          export PATH="${JAVA_HOME_21_arm64}/bin:${PATH}"
          node scripts/ignored-browser-gates.mjs --groups=dotnet,kotlin,java
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty

      - name: Verify managed repository resources in every Yon language
        run: |
          cargo test --locked -p tachyon-core --test it -- managed_resources:: --test-threads=1
          node crates/tachyon-core/tests/managed-resource-transports.mjs
        env:
          TAC_STORAGE_REQUIRE_TOOLCHAINS: "1"

      - name: Verify local events and lifecycle in every Yon language
        run: |
          cargo test --locked -p tachyon-core --test it -- local_events:: --test-threads=1
        env:
          TAC_EVENTS_REQUIRE_TOOLCHAINS: "1"

      - name: Verify activation-owned native events in all four companion languages
        run: |
          cargo test --locked -p tachyon-core --lib native::events::tests::native_event_owner_units_are_emitted -- --exact
          node scripts/native/events-test.mjs rs swift kt cs
        env:
          TAC_NATIVE_EVENT_FIXTURES: ${{ runner.temp }}/native-event-owners
          TAC_NATIVE_EVENT_TEST_ROOT: ${{ runner.temp }}

      - name: Run the migrated website acceptance suite
        run: bun run test:website

      - name: Start Redis for the application configuration worked example
        run: |
          if ! brew list redis >/dev/null 2>&1; then
            brew install redis
          fi
          redis-server --daemonize yes
          for _ in $(seq 1 20); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 0.5
          done
          redis-cli ping

      - name: Execute published snippets with every server toolchain required
        run: node website/scripts/verify-snippets.mjs
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty
          TAC_SNIPPETS_REQUIRE_TOOLCHAINS: '1'

      - name: Verify website typing through custom elements on desktop and mobile
        run: bun run test:website-browser

      - name: Verify cached HTTP clients in every Tac language and browser
        run: |
          export PATH="${JAVA_HOME_21_arm64}/bin:${PATH}"
          bun run test:cached-client-browser
        env:
          TAC_BIN: ${{ github.workspace }}/target/debug/ty

      - name: Run native launch, accessibility, lifecycle, and visual parity gate
        run: bun run test:phase4-macos

      - name: Execute Swift and WKWebView behavior in an isolated iOS simulator
        run: node scripts/ios/native-test.mjs

  linux-native:
    name: Phase 5 Linux GTK4 native gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the pinned Linux execution image
        run: docker build -f scripts/linux/Dockerfile -t tachyon-linux-gate:${{ env.RUST_TOOLCHAIN }} scripts/linux

      - name: Compile, launch, and read accessible names over AT-SPI
        run: >-
          docker run --rm
          --cap-add SYS_ADMIN --cap-add NET_ADMIN
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          -v "$PWD":/workspace -w /workspace
          -e CARGO_TARGET_DIR=/tmp/ty-target
          tachyon-linux-gate:${{ env.RUST_TOOLCHAIN }}
          ./scripts/linux/native-test.sh

  windows-native:
    name: Windows WebView2 native gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Install native companion .NET toolchain
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Build, launch, and drive the generated application
        shell: powershell
        run: ./scripts/windows/native-test.ps1

  android-native:
    name: Phase 5 Android native gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_USER_HOME: /tmp/tachyon-android
      ANDROID_AVD_HOME: /tmp/tachyon-android/avd

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Bun for native WebView acceptance
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install locked native UI probe dependencies
        run: bun install --frozen-lockfile

      - name: Select the runner's preinstalled JDK and Gradle
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_21_X64}/bin" >> "${GITHUB_PATH}"
          gradle --version
          java -version

      - name: Accept the Android SDK licenses
        run: |
          set -eu
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Allow every user to use KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create the Android virtual device
        run: |
          set -euo pipefail
          avdmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${avdmanager}" create avd -n tachyon-gate \
            -k "system-images;android-35;google_apis;x86_64" \
            -p "${ANDROID_AVD_HOME}/tachyon-gate.avd" \
            --device pixel_6 --force
          test -f "${ANDROID_AVD_HOME}/tachyon-gate.ini"
          test -d "${ANDROID_AVD_HOME}/tachyon-gate.avd"
          "${avdmanager}" list avd

      - name: Start a headless emulator
        run: |
          set -euo pipefail
          nohup "${ANDROID_HOME}/emulator/emulator" -avd tachyon-gate \
            -no-window -no-audio -no-snapshot -no-boot-anim \
            > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid

      - name: Wait for Android to finish booting
        id: wait-for-boot
        run: |
          set -euo pipefail
          adb="${ANDROID_HOME}/platform-tools/adb"
          timeout 180 "${adb}" wait-for-device
          boot_deadline=$((SECONDS + 600))
          until [ "$("${adb}" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
            if [ "${SECONDS}" -ge "${boot_deadline}" ]; then
              echo 'Android did not report sys.boot_completed=1 within 600 seconds' >&2
              exit 124
            fi
            sleep 5
          done

      - name: Show emulator diagnostics after a failed boot
        if: failure() && steps.wait-for-boot.outcome == 'failure'
        run: |
          echo '--- emulator process ---'
          ps -p "$(cat /tmp/emulator.pid)" -f || true
          echo '--- adb devices ---'
          "${ANDROID_HOME}/platform-tools/adb" devices -l || true
          echo '--- emulator log ---'
          tail -200 /tmp/emulator.log || true

      - name: Assemble, launch, and drive the generated application
        run: ./scripts/android/native-test.sh

  compatibility:
    name: Phase 6 legacy compatibility differential
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install locked browser dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Build the Phase 6 CLI
        run: cargo build --locked --bin ty

      - name: Fetch the immutable v26.30.04 compatibility oracle
        run: |
          set -euo pipefail
          legacy_binary="${RUNNER_TEMP}/tachyon-compat/ty-linux-x64"
          expected_checksum=0ccf5db78f196db3d9279b2a533a22e2413a146c91968775aa7c988d0c89f72d
          mkdir -p "${RUNNER_TEMP}/tachyon-compat"
          curl --fail --location --silent --show-error \
            --output "${legacy_binary}" \
            https://github.com/d31ma/Tachyon/releases/download/v26.30.04/ty-linux-x64
          echo "${expected_checksum}  ${legacy_binary}" | sha256sum --check --strict
          chmod 0755 "${legacy_binary}"
          echo "TAC_LEGACY_BIN=${legacy_binary}" >> "${GITHUB_ENV}"

      - name: Compare both implementations over the shared corpus
        run: bun run test:compat

      - name: Run the released standalone workflow against Rust
        run: bun run test:standalone-rust

      - name: Classify the archived migration fixture
        run: >-
          ./target/debug/ty migrate check
          crates/tachyon-cli/tests/fixtures/migration-fullstack
          --allow-unsupported

  fuzz:
    name: Phase 7 fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rust-src

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz every trust boundary under AddressSanitizer
        run: |
          set -euo pipefail
          for target in html_frontend template_frontend handler_frame native_planner yon_annotations application_config managed_resource_headers; do
            echo "==> ${target}"
            cargo +nightly-2026-07-20 fuzz run "${target}" -- \
              "-max_total_time=${FUZZ_SECONDS}" -rss_limit_mb=2048 -timeout=10
          done
        env:
          FUZZ_SECONDS: "300"

      - name: Publish any crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  sanitizers:
    name: Phase 7 sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rust-src

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Run the library suite under AddressSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=address"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

      - name: Run the library suite under LeakSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=leak"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

      - name: Run the library suite under ThreadSanitizer
        run: >-
          RUSTFLAGS="-Zsanitizer=thread"
          cargo +nightly-2026-07-20 test -p tachyon-core --lib
          -Zbuild-std
          --target x86_64-unknown-linux-gnu

  soak:
    name: Phase 7 soak and recovery drills
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run interruption, corruption, contention, and load drills
        run: |
          cargo test --locked -p tachyon-cli --test it -- phase7_cli:: --test-threads=1
        env:
          TAC_SOAK_ITERATIONS: "200"

  provenance:
    name: Phase 7 supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install pinned SBOM and audit tooling
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo install cargo-auditable --version 0.7.0 --locked

      - name: Generate a CycloneDX software bill of materials
        run: cargo cyclonedx --all --format json

      - name: Build a release binary with an embedded dependency list
        run: cargo auditable build --release --locked --bin ty

      - name: Publish the bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: "**/*.cdx.json"

  release-lifecycle:
    name: Cutover release lifecycle drill
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Verify, install, upgrade, roll back, and uninstall a real artifact
        run: ./scripts/release/lifecycle-drill.sh

      - name: Build the artifact retained for attestation
        run: ./scripts/release/build-artifact.sh

      - name: Attest what built this artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/release-artifact/*.tar.gz

      - name: Publish the verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tachyon-${{ matrix.os }}
          path: target/release-artifact/*.tar.gz

  coverage:
    name: Rust coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install Go for the Go rows of the workspace tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked

      - name: Enforce the whole-workspace coverage floor
        run: >-
          cargo llvm-cov
          --workspace
          --all-features
          --locked
          --ignore-filename-regex 'crates/tachyon-core/src/native/(compiler|macos)\.rs'
          --fail-under-lines 80
          --fail-under-functions 80
          --fail-under-regions 80
